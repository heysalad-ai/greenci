<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GreenCI mobile home</title>

<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/components.css">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0b7a55;text-decoration:none}a:hover{color:#23272e}
</style>

<div data-theme="light" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
<div style="flex: 1; padding: 56px 16px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center"><img src="../../design-system/assets/logos/greenci-symbol.svg" alt="GreenCI" style="width: 36px; height: 36px"><span class="gc-chip gc-chip--pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"></circle></svg>Deck online</span></div>
<h1 style="margin: 0; font: 650 30px/34px var(--font-display); letter-spacing: -.015em">One thing is red.</h1>

<a href="MobileRun.dc.html" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 20px; background: var(--deck); color: var(--on-deck)">
<div style="display: flex; gap: 14px; align-items: center"><img src="../../design-system/assets/moods/key-failing.svg" alt="" style="width: 56px; height: 56px"><div style="min-width: 0"><div style="font: 600 17px/22px var(--font-sans)">test (ubuntu) failed</div><div style="font-size: 13px; color: #a8b3ae">acme/payments · main · 9 min</div></div></div>
<span style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: var(--brand); color: #06281c; box-shadow: inset 0 -5px 0 rgba(0,0,0,.28); font: 600 15px var(--font-sans)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg>Diagnose</span>
</a>

<a href="MobileApprove.dc.html" class="gc-banner gc-banner--wait" style="color: var(--ink)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg><span><b>Needs you</b> · acme/ledger fix touches a migration</span></a>

<section style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 4px 0 8px; font: 600 12px/16px var(--font-sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted)">Watching</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line)"><img src="../../design-system/assets/moods/key-verifying.svg" alt="" style="width: 32px; height: 32px"><span style="flex: 1; font-size: 15px">acme/web</span><span class="gc-chip gc-chip--work">Verifying 7/12</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line)"><img src="../../design-system/assets/moods/key-passing.svg" alt="" style="width: 32px; height: 32px"><span style="flex: 1; font-size: 15px">acme/agent</span><span class="gc-chip gc-chip--pass">Passing</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line)"><img src="../../design-system/assets/moods/key-passing.svg" alt="" style="width: 32px; height: 32px"><span style="flex: 1; font-size: 15px">greenci/practice</span><span class="gc-chip gc-chip--pass">Passing</span></div>
</section>

<div style="margin-top: auto; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--brand-tint); display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px">This week</span><span style="font: 600 15px var(--font-sans); color: var(--brand-ink)">9 checks fixed · 14 min median red</span></div>
</div>

<nav aria-label="Tabs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); background: var(--surface-raised); padding: 8px 8px 28px; font: 600 11px var(--font-sans)">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--brand-ink)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12h4l3-7 3 14 3-7h3"></path></svg>Runs</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--ink-muted)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2"></circle><circle cx="6" cy="18.5" r="2"></circle><circle cx="18" cy="18.5" r="2"></circle><path d="M6 7.5v9M18 16.5V10a3 3 0 0 0-3-3h-4"></path></svg>PRs</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--ink-muted)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 15h2M11 15h2M15 15h2"></path></svg>Deck</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--ink-muted)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg>You</a>
</nav>
</div>


</body>
</html>
