name: Cloudflare deployment
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target }}
    env:
      WRANGLER_SEND_METRICS: false
      NEXT_TELEMETRY_DISABLED: 1
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check environment setup
        run: node scripts/deploy-preflight.mjs "$TARGET"
      - name: Require production reviewers
        if: inputs.target == 'production'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getEnvironment({ ...context.repo, environment_name: 'production' });
            const rule = data.protection_rules?.find(rule => rule.type === 'required_reviewers');
            if (!rule?.reviewers?.length || !rule.prevent_self_review || data.can_admins_bypass) {
              throw new Error('Production requires reviewers, self-review prevention and no admin bypass');
            }
      - run: pnpm lint && pnpm typecheck && pnpm test:core && pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm --filter @greenci/web build:worker --env "$TARGET"
      - name: Migrate and deploy in dependency order
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: |
            d1 migrations apply DB --config apps/api/wrangler.jsonc --env ${{ inputs.target }} --remote
            deploy --config apps/sandbox/wrangler.jsonc --env ${{ inputs.target }}
            deploy --config apps/api/wrangler.jsonc --env ${{ inputs.target }}
            deploy --config apps/web/wrangler.jsonc --env ${{ inputs.target }}
      - name: Authenticated smoke
        id: smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/smoke-deployment.mjs "$TARGET"
      - name: Roll back failed production smoke
        if: failure() && inputs.target == 'production' && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: |
            rollback --yes --config apps/web/wrangler.jsonc --env production
            rollback --yes --config apps/api/wrangler.jsonc --env production
            rollback --yes --config apps/sandbox/wrangler.jsonc --env production
